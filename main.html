<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>主页</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="spacer-top"></div>
  <div class="main-wrap">
    <div>
      <div class="time"><span class="hm" id="hm">--:--</span><span class="sec" id="sec">--</span></div>
      <div class="date" id="date"></div>
    </div>

    <form id="f" autocomplete="off">
      <svg class="mag" viewBox="0 0 24 24" fill="none">
        <path
          d="M11.5 3C16.1944 3 20 6.80558 20 11.5C20 13.523 19.2933 15.381 18.1132 16.8404L21.1364 19.8636C21.4879 20.2151 21.4879 20.7849 21.1364 21.1364C20.7849 21.4879 20.2151 21.4879 19.8636 21.1364L16.8404 18.1132C15.381 19.2933 13.523 20 11.5 20C6.80558 20 3 16.1944 3 11.5C3 6.80558 6.80558 3 11.5 3ZM11.5 18.2C15.2003 18.2 18.2 15.2003 18.2 11.5C18.2 7.79969 15.2003 4.8 11.5 4.8C7.79969 4.8 4.8 7.79969 4.8 11.5C4.8 15.2003 7.79969 18.2 11.5 18.2Z"
          fill="currentColor" />
      </svg>
      <input id="q" type="text" placeholder="输入关键词，回车搜索" aria-label="搜索">

      <div class="eng" id="eng">
        <button type="button" class="eng-btn" id="engBtn" aria-haspopup="listbox" aria-expanded="false">
          <img class="eng-icon" id="engIcon" src="assets/engine_icon/bing.svg" alt="Bing">
          <span id="engName">Bing</span>
          <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none">
            <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </button>

        <div class="eng-menu" id="engMenu" role="listbox">
          <button type="button" role="option" data-v="bing">
            <span class="eng-opt-label">
              <img class="eng-icon" src="assets/engine_icon/bing.svg" alt="">
              <span>Bing</span>
            </span>
            <svg class="ok" viewBox="0 0 24 24" fill="none">
              <path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </button>

          <button type="button" role="option" data-v="google">
            <span class="eng-opt-label">
              <img class="eng-icon" src="assets/engine_icon/google.svg" alt="">
              <span>Google</span>
            </span>
            <svg class="ok" viewBox="0 0 24 24" fill="none">
              <path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </button>

          <button type="button" role="option" data-v="ddg">
            <span class="eng-opt-label">
              <img class="eng-icon" src="assets/engine_icon/ddg.svg" alt="">
              <span>DuckDuckGo</span>
            </span>
            <svg class="ok" viewBox="0 0 24 24" fill="none">
              <path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </button>
        </div>
      </div>
    </form>
  </div>
  <div class="spacer-bottom"></div>

  <div class="quote" id="quote" title="点击换一句">
    <div class="qt" id="qt">正在拉取一言…</div>
    <div class="qf" id="qf"></div>
  </div>

  <script src="script.js"></script>
</body>

</html>
